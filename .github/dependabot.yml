# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm" # See documentation for possible values
    directory: "/front" # Location of package manifests
    schedule:
      interval: "weekly"
    ignore:
      # typescript-eslint (via eslint-config-next) plafonne son peer TS a <6.1.0 et
      # refuse de demarrer au-dela : https://github.com/typescript-eslint/typescript-eslint/issues/10940
      - dependency-name: "typescript"
        versions: [">=6.1"]
      # La majeure suit le runtime (front/.nvmrc + Dockerfile), montee a la main.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    # Une seule PR pour tous les patch/minor ; les majeures restent isolées
    groups:
      npm-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "maven" # See documentation for possible values
    directory: "/api" # Location of package manifests
    schedule:
      interval: "weekly"
    groups:
      maven-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  # Maintient à jour les actions utilisées par .github/workflows/ci.yml
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
