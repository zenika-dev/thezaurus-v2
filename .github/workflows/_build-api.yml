name: (interne) Build API

on:
  workflow_call:
    inputs:
      version:
        description: Version à builder (ex. 2026.09.30-abc1234)
        required: true
        type: string
    outputs:
      image:
        description: Référence de l'image par digest
        value: ${{ jobs.build.outputs.image }}

jobs:
  build:
    name: API (Quarkus)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: ${{ vars.GCP_REGISTRY }}/api
    outputs:
      image: ${{ steps.digest.outputs.image }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/gcp-docker-login
        with:
          region: ${{ vars.GCP_REGION }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      # Ne jamais reconstruire une version déjà publiée
      - name: Vérifier si l'image existe déjà
        id: check
        run: |
          if gcloud artifacts docker images describe "${IMAGE}:${{ inputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "${IMAGE}:${{ inputs.version }} existe déjà, pas de rebuild"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup JDK 21
        if: steps.check.outputs.exists != 'true'
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Compiler l'API Quarkus
        if: steps.check.outputs.exists != 'true'
        working-directory: api
        run: ./mvnw -B package
        
      - name: Build et push de l'API
        if: steps.check.outputs.exists != 'true'
        run: |
          docker build -t "${IMAGE}:${{ inputs.version }}" \
            -f api/src/main/docker/Dockerfile.jvm ./api
          docker push "${IMAGE}:${{ inputs.version }}"

      - name: Récupérer le digest
        id: digest
        run: |
          DIGEST=$(gcloud artifacts docker images describe "${IMAGE}:${{ inputs.version }}" \
            --format='value(image_summary.digest)')
          echo "image=${IMAGE}@${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "api → ${DIGEST}"
