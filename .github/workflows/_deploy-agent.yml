name: (interne) Deploy talks-agent

# Déploie talks-agent sur Agent Runtime avec agents-cli.
# agents-cli construit une image à partir du Dockerfile (serveur app/fast_api_app.py)
# et met à jour l'instance existante identifiée par AGENT_ENGINE_ID.
# Les tests et la release (tag agent-vX.Y.Z) ont déjà eu lieu dans release.yml.
on:
  workflow_call:
    inputs:
      version:
        description: Version semantic-release déployée (ex. 1.2.0)
        required: true
        type: string

jobs:
  deploy:
    name: Agent Runtime (production)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
    concurrency:
      group: deploy-agent-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        # pyproject.toml, le manifeste et le Dockerfile sont lus depuis ce dossier
        working-directory: agents/talks-agent
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      AGENT_ENGINE_REGION: ${{ vars.GCP_REGION }}
      AGENT_ENGINE_ID: ${{ vars.AGENT_ENGINE_ID }}
    steps:
      - name: Vérifier la configuration de l'environnement
        working-directory: .
        env:
          REQUIRED: >-
            GCP_PROJECT_ID=${{ vars.GCP_PROJECT_ID }}
            AGENT_ENGINE_REGION=${{ vars.GCP_REGION }}
            AGENT_ENGINE_ID=${{ vars.AGENT_ENGINE_ID }}
            WIF_PROVIDER=${{ vars.WIF_PROVIDER }}
            WIF_AGENT_SERVICE_ACCOUNT=${{ vars.WIF_AGENT_SERVICE_ACCOUNT }}
        run: |
          MISSING=0
          for pair in $REQUIRED; do
            if [ -z "${pair#*=}" ]; then
              echo "::error::Variable '${pair%%=*}' manquante dans l'environnement production"
              MISSING=1
            fi
          done
          exit $MISSING

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installer uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_AGENT_SERVICE_ACCOUNT }}

      - name: Installer le Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          install_components: beta

      # agents-cli cible l'instance enregistrée dans deployment_metadata.json.
      # Sans ID, il chercherait par nom affiché et pourrait créer une nouvelle instance.
      - name: Cibler l'instance existante
        run: |
          case "$AGENT_ENGINE_ID" in
            projects/*) ID="$AGENT_ENGINE_ID" ;;
            *) ID="projects/$GCP_PROJECT_ID/locations/$AGENT_ENGINE_REGION/reasoningEngines/$AGENT_ENGINE_ID" ;;
          esac
          echo "{\"remote_agent_runtime_id\": \"$ID\"}" > deployment_metadata.json

      # --update-only : échoue au lieu de créer une deuxième instance si la cible est introuvable.
      - name: Déployer sur Agent Runtime
        env:
          VERSION: ${{ inputs.version }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          # Une valeur de label n'accepte ni points ni majuscules
          VERSION_LABEL=$(echo "$VERSION" | tr '.' '-' | tr '[:upper:]' '[:lower:]')
          uvx google-agents-cli@1.10.0 deploy \
            --labels="version=${VERSION_LABEL}" \
            --project "$GCP_PROJECT_ID" \
            --region "$AGENT_ENGINE_REGION" \
            --update-only \
            --service-name talk_agent \
            --no-confirm-project \
            --update-env-vars="OTEL_RESOURCE_ATTRIBUTES=service.version=${COMMIT_SHA}"
