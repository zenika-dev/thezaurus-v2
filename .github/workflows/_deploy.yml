name: (interne) Deploy Cloud Run

on:
  workflow_call:
    inputs:
      environment:
        description: Environnement cible (production, staging) — sa config est lue dans .github/envs/<environment>.env
        required: true
        type: string
      version:
        description: Version déployée (ex. 2026.09.30-abc1234)
        required: true
        type: string
      api_image:
        description: Image API par digest
        required: true
        type: string
      front_image:
        description: Image front par digest
        required: true
        type: string

jobs:
  deploy:
    name: Cloud Run (${{ inputs.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # L'environnement GitHub ne sert qu'à l'historique des déploiements : la config vient du fichier
    # .github/envs/<environment>.env. L'URL est celle renvoyée par le step de déploiement.
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.deploy.outputs.url }}
    # Jamais deux déploiements simultanés sur le même environnement, et jamais d'annulation
    # en plein vol (un déploiement interrompu laisse le service dans un état incertain).
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      TARGET_ENV: ${{ inputs.environment }}
    steps:
      # Seul le dossier de config est nécessaire : pas besoin du code source.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/envs
          persist-credentials: false

      # Charge la config de l'env dans $GITHUB_ENV. Liste blanche de clés : une clé inconnue est ignorée,
      # une clé absente ou vide fait échouer le job avant tout déploiement.
      - name: Charger la configuration de l'environnement
        run: |
          CONFIG=".github/envs/${TARGET_ENV}.env"
          if ! [[ "$TARGET_ENV" =~ ^[a-z0-9-]+$ ]] || [ ! -f "$CONFIG" ]; then
            echo "::error::Configuration introuvable : ${CONFIG}"
            exit 1
          fi
          KEYS="GCP_PROJECT_ID GCP_REGION SERVICE_NAME WIF_PROVIDER WIF_SERVICE_ACCOUNT
                RUNTIME_SERVICE_ACCOUNT NEXTAUTH_URL GOOGLE_CLIENT_ID FIRESTORE_DATABASE_ID
                FIRESTORE_COLLECTION_PREFIX PROFILE_PHOTOS_BUCKET SECRET_PREFIX
                SCHEDULER_SERVICE_ACCOUNT FEEDBACK_REMINDER_AUDIENCE FEEDBACK_REMINDER_ENABLED
                MAILGUN_DOMAIN MAILGUN_BASE_URL SMTP_FROM"
          MISSING=0
          for key in $KEYS; do
            value=$(grep -E "^${key}=" "$CONFIG" | tail -n 1 | cut -d= -f2-)
            if [ -z "$value" ]; then
              echo "::error::'${key}' manquant ou vide dans ${CONFIG}"
              MISSING=1
              continue
            fi
            echo "${key}=${value}" >> "$GITHUB_ENV"
          done
          exit $MISSING

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # Service Cloud Run multi-conteneurs (front ingress + api sidecar), défini ici et appliqué
      # avec `gcloud run services replace` : ce bloc est la source de vérité de la config de prod.
      # Toute modification manuelle dans la console sera écrasée au déploiement suivant.
      - name: Rendre le manifeste Cloud Run
        env:
          VERSION: ${{ inputs.version }}
          API_IMAGE: ${{ inputs.api_image }}
          FRONT_IMAGE: ${{ inputs.front_image }}
        run: |
          # Une valeur de label n'accepte ni points ni majuscules
          VERSION_LABEL=$(echo "$VERSION" | tr '.' '-' | tr '[:upper:]' '[:lower:]')
          export VERSION_LABEL
          # Heredoc non interprété par le shell, puis envsubst avec une liste explicite :
          # seules ces variables sont substituées
          envsubst '${SERVICE_NAME} ${GCP_REGION} ${VERSION_LABEL} ${API_IMAGE} ${FRONT_IMAGE}
                    ${GCP_PROJECT_ID} ${RUNTIME_SERVICE_ACCOUNT} ${NEXTAUTH_URL} ${GOOGLE_CLIENT_ID}
                    ${FIRESTORE_DATABASE_ID} ${FIRESTORE_COLLECTION_PREFIX} ${PROFILE_PHOTOS_BUCKET}
                    ${SECRET_PREFIX} ${SCHEDULER_SERVICE_ACCOUNT} ${FEEDBACK_REMINDER_AUDIENCE}
                    ${MAILGUN_DOMAIN} ${MAILGUN_BASE_URL} ${SMTP_FROM}
                    ${FEEDBACK_REMINDER_ENABLED}' \
            > service.rendered.yaml <<'MANIFEST'
          apiVersion: serving.knative.dev/v1
          kind: Service
          metadata:
            name: "${SERVICE_NAME}"
            labels:
              cloud.googleapis.com/location: "${GCP_REGION}"
            annotations:
              run.googleapis.com/ingress: all
          spec:
            template:
              metadata:
                labels:
                  app-version: "${VERSION_LABEL}"
                annotations:
                  autoscaling.knative.dev/minScale: "0"
                  autoscaling.knative.dev/maxScale: "1"
                  # Le JVM démarre plus vite avec du CPU supplémentaire pendant le boot
                  run.googleapis.com/startup-cpu-boost: "true"
                  # Le front ne démarre qu'une fois l'API prête (startupProbe de l'api)
                  run.googleapis.com/container-dependencies: '{"front":["api"]}'
              spec:
                # Identité de l'application, distincte du compte de la CI (WIF_SERVICE_ACCOUNT) :
                # Firestore, Secret Manager et Vertex AI uniquement, aucun droit de déploiement.
                serviceAccountName: "${RUNTIME_SERVICE_ACCOUNT}"
                containerConcurrency: 80
                timeoutSeconds: 300
                containers:
                  - name: front
                    image: "${FRONT_IMAGE}"
                    ports:
                      - name: http1
                        containerPort: 3000
                    env:
                      - name: API_URL
                        value: http://localhost:8080
                      - name: NEXTAUTH_URL
                        value: "${NEXTAUTH_URL}"
                      - name: GOOGLE_CLIENT_ID
                        value: "${GOOGLE_CLIENT_ID}"
                      - name: GOOGLE_CLIENT_SECRET
                        valueFrom:
                          secretKeyRef:
                            name: "${SECRET_PREFIX}-google-client-secret"
                            key: latest
                      - name: NEXTAUTH_SECRET
                        valueFrom:
                          secretKeyRef:
                            name: "${SECRET_PREFIX}-nextauth-secret"
                            key: latest
                    resources:
                      limits:
                        cpu: "1"
                        memory: 512Mi
                    startupProbe:
                      tcpSocket:
                        port: 3000
                      periodSeconds: 5
                      failureThreshold: 12

                  - name: api
                    image: "${API_IMAGE}"
                    env:
                      - name: QUARKUS_HTTP_PORT
                        value: "8080"
                      - name: GOOGLE_CLOUD_PROJECT_ID
                        value: "${GCP_PROJECT_ID}"
                      - name: FIRESTORE_DATABASE_ID
                        value: "${FIRESTORE_DATABASE_ID}"
                      - name: FIRESTORE_COLLECTION_PREFIX
                        value: "${FIRESTORE_COLLECTION_PREFIX}"
                      - name: PROFILE_PHOTOS_BUCKET
                        value: "${PROFILE_PHOTOS_BUCKET}"
                      - name: GOOGLE_CLIENT_ID
                        value: "${GOOGLE_CLIENT_ID}"
                      # URL publique de l'appli : liens absolus des emails ({{talksUrl}})
                      - name: THEZAURUS_PUBLIC_URL
                        value: "${NEXTAUTH_URL}"
                      - name: FEEDBACK_REMINDER_ENABLED
                        value: "${FEEDBACK_REMINDER_ENABLED}"
                      - name: FEEDBACK_REMINDER_AUDIENCE
                        value: "${FEEDBACK_REMINDER_AUDIENCE}"
                      # Seul compte autorisé à déclencher les rappels post-talk (Cloud Scheduler)
                      - name: FEEDBACK_REMINDER_INVOKER
                        value: "${SCHEDULER_SERVICE_ACCOUNT}"
                      # Envoi des emails de rappel post-talk via l'API HTTP Mailgun (région EU)
                      - name: SMTP_FROM
                        value: "${SMTP_FROM}"
                      - name: MAILGUN_DOMAIN
                        value: "${MAILGUN_DOMAIN}"
                      - name: MAILGUN_BASE_URL
                        value: "${MAILGUN_BASE_URL}"
                      - name: MAILGUN_SENDING_KEY
                        valueFrom:
                          secretKeyRef:
                            name: thezaurus-mailgun-sending-key
                            key: latest
                      - name: SLACK_BOT_TOKEN
                        valueFrom:
                          secretKeyRef:
                            name: thezaurus-slack-bot-token
                            key: latest
                      - name: SLACK_SIGNING_SECRET
                        valueFrom:
                          secretKeyRef:
                            name: thezaurus-slack-signing-secret
                            key: latest
                    resources:
                      limits:
                        cpu: "1"
                        memory: 1Gi
                    # Endpoints fournis par quarkus-smallrye-health
                    startupProbe:
                      httpGet:
                        path: /q/health/ready
                        port: 8080
                      periodSeconds: 5
                      failureThreshold: 24
                    livenessProbe:
                      httpGet:
                        path: /q/health/live
                        port: 8080
                      periodSeconds: 30
            traffic:
              - percent: 100
                latestRevision: true
          MANIFEST
          cat service.rendered.yaml

      # Mémorise la révision qui sert actuellement le trafic, pour pouvoir y revenir
      # (pas latestReadyRevisionName : après un rollback, ce n'est pas elle qui sert)
      - name: Révision actuelle
        id: previous
        run: |
          REV=$(gcloud run services describe "$SERVICE_NAME" --region "$GCP_REGION" \
            --project "$GCP_PROJECT_ID" \
            --format='value(status.traffic[0].revisionName)' 2>/dev/null || true)
          echo "revision=${REV}" >> "$GITHUB_OUTPUT"
          echo "Révision actuelle : ${REV:-aucune (premier déploiement)}"

      # `replace` attend que la nouvelle révision soit prête. Si ses startupProbes
      # échouent, Cloud Run ne lui envoie aucun trafic : l'ancienne révision continue de servir.
      - name: Déployer
        id: deploy
        run: |
          gcloud run services replace service.rendered.yaml \
            --region "$GCP_REGION" --project "$GCP_PROJECT_ID"
          URL=$(gcloud run services describe "$SERVICE_NAME" --region "$GCP_REGION" \
            --project "$GCP_PROJECT_ID" --format='value(status.url)')
          echo "url=${URL}" >> "$GITHUB_OUTPUT"

      # Vérifie de bout en bout que le front répond et que NextAuth est configuré
      - name: Smoke test
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          for i in $(seq 1 10); do
            if curl -sSf -o /dev/null "${URL}/api/auth/providers"; then
              echo "OK : ${URL}"
              exit 0
            fi
            echo "Tentative ${i}/10 échouée, nouvel essai dans 6s"
            sleep 6
          done
          echo "::error::Smoke test KO sur ${URL}"
          exit 1

      - name: Rollback vers la révision précédente
        if: failure() && steps.previous.outputs.revision != ''
        env:
          PREVIOUS_REVISION: ${{ steps.previous.outputs.revision }}
        run: |
          gcloud run services update-traffic "$SERVICE_NAME" \
            --region "$GCP_REGION" --project "$GCP_PROJECT_ID" \
            --to-revisions="${PREVIOUS_REVISION}=100"
          echo "::warning::Trafic remis sur ${PREVIOUS_REVISION}"

      - name: Résumé
        if: always()
        env:
          VERSION: ${{ inputs.version }}
          API_IMAGE: ${{ inputs.api_image }}
          FRONT_IMAGE: ${{ inputs.front_image }}
          PREVIOUS_REVISION: ${{ steps.previous.outputs.revision || 'aucune' }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "### Déploiement ${TARGET_ENV} — ${VERSION}"
            echo "- URL : ${NEXTAUTH_URL}"
            echo "- API : \`${API_IMAGE}\`"
            echo "- Front : \`${FRONT_IMAGE}\`"
            echo "- Révision précédente : ${PREVIOUS_REVISION}"
            echo "- Statut : ${JOB_STATUS}"
          } >> "$GITHUB_STEP_SUMMARY"
