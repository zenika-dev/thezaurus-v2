name: (interne) Image Front

on:
  workflow_call:
    inputs:
      version:
        description: Version à builder (ex. 2026.09.30-abc1234)
        required: true
        type: string
    outputs:
      image:
        description: Référence de l'image par digest
        value: ${{ jobs.build.outputs.image }}

jobs:
  build:
    name: Front (Next.js)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: ${{ vars.GCP_REGISTRY }}/front
    outputs:
      image: ${{ steps.digest.outputs.image }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/gcp-docker-login
        with:
          region: ${{ vars.GCP_REGION }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      # Ne jamais reconstruire une version déjà publiée
      - name: Vérifier si l'image existe déjà
        id: check
        run: |
          if gcloud artifacts docker images describe "${IMAGE}:${{ inputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "${IMAGE}:${{ inputs.version }} existe déjà, pas de rebuild"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Compilé dans son Dockerfile multi-stage (contexte = racine du repo).
      # Aucune config d'environnement n'est figée dans l'image (GOOGLE_CLIENT_ID est lu
      # au runtime) : la même image peut être promue d'un environnement à l'autre.
      - name: Build et push du front
        if: steps.check.outputs.exists != 'true'
        run: |
          docker build -t "${IMAGE}:${{ inputs.version }}" \
            -f front/Dockerfile --target runner .
          docker push "${IMAGE}:${{ inputs.version }}"

      - name: Récupérer le digest
        id: digest
        run: |
          DIGEST=$(gcloud artifacts docker images describe "${IMAGE}:${{ inputs.version }}" \
            --format='value(image_summary.digest)')
          echo "image=${IMAGE}@${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "front → ${DIGEST}"
