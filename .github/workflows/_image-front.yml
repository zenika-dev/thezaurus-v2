name: (interne) Image Front

on:
  workflow_call:
    inputs:
      version:
        description: Version semantic-release à builder (ex. 1.2.0)
        required: true
        type: string
    outputs:
      image:
        description: Référence de l'image par digest
        value: ${{ jobs.build.outputs.image }}

jobs:
  build:
    name: Front (Next.js)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ inputs.version }}
      IMAGE: ${{ vars.GCP_REGISTRY }}/front
    outputs:
      image: ${{ steps.digest.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/gcp-docker-login
        with:
          region: ${{ vars.GCP_REGION }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Ne jamais reconstruire une version déjà publiée
      - name: Vérifier si l'image existe déjà
        id: check
        run: |
          if gcloud artifacts docker images describe "${IMAGE}:${VERSION}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "${IMAGE}:${VERSION} existe déjà, pas de rebuild"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Compilé dans son Dockerfile multi-stage (contexte = racine du repo).
      # Aucune config d'environnement n'est figée dans l'image (GOOGLE_CLIENT_ID est lu
      # au runtime) : la même image peut être promue d'un environnement à l'autre.
      # Cache des couches dans le cache GitHub Actions : sans changement de dépendances,
      # `npm ci` n'est pas rejoué.
      - name: Build et push du front
        if: steps.check.outputs.exists != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: front/Dockerfile
          target: runner
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          push: true
          # Manifeste simple (pas d'index OCI avec attestation) : identique au build docker classique
          provenance: false
          cache-from: type=gha,scope=front
          cache-to: type=gha,mode=max,scope=front

      - name: Récupérer le digest
        id: digest
        run: |
          DIGEST=$(gcloud artifacts docker images describe "${IMAGE}:${VERSION}" \
            --format='value(image_summary.digest)')
          echo "image=${IMAGE}@${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "front → ${DIGEST}"
