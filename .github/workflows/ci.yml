name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Une seule exécution par branche/PR : les runs obsolètes sont annulés,
# sauf sur main où chaque commit doit être validé jusqu'au bout.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  api:
    name: API (Quarkus)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      # `verify` enchaîne spotless:check (phase validate), la compilation,
      # les tests unitaires et le build Quarkus (quarkus:build).
      - name: Build & tests
        run: ./mvnw -B -ntp verify

      # `verify` régénère target/openapi/openapi.json depuis les annotations JAX-RS.
      # La copie versionnée (api/openapi.json) doit être strictement identique.
      - name: Copie du contrat OpenAPI généré
        run: cp target/openapi/openapi.json openapi.json

      - name: Vérification de la synchronisation du contrat OpenAPI
        run: |
          git diff --exit-code openapi.json \
            || { echo "::error::api/openapi.json est obsolète. Lancez './mvnw package -DskipTests && cp target/openapi/openapi.json openapi.json' et committez le résultat."; exit 1; }

      - name: Upload des rapports de tests en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: api-surefire-reports
          path: api/target/surefire-reports/
          retention-days: 7

  front:
    name: Front (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v7

      # front/.nvmrc fait foi ; garder le Dockerfile aligné (node:<version>-alpine).
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: front/.nvmrc
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: |
            front/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('front/package-lock.json') }}-${{ hashFiles('front/**/*.ts', 'front/**/*.tsx', 'front/**/*.js', 'front/**/*.jsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('front/package-lock.json') }}-

      # `npm ci` échoue si package.json et package-lock.json divergent :
      # c'est le premier filet de sécurité sur les PR Dependabot.
      - name: Install
        run: npm ci

      # Régénère shared/api/schema.d.ts, shared/api/enums.ts et shared/api/contract.ts depuis api/openapi.json.
      - name: Régénération des types du contrat
        run: npm run generate:api

      - name: Vérification de la synchronisation des types du contrat
        run: |
          git diff --exit-code shared/api/schema.d.ts shared/api/enums.ts shared/api/contract.ts \
            || { echo "::error::Les types TypeScript générés sont obsolètes. Lancez 'npm run generate:api' et committez le résultat."; exit 1; }

      - name: Lint
        run: npm run lint

      # `next build` fait aussi le type-check TypeScript.
      - name: Build
        run: npm run build
