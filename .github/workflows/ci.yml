name: CI

# Tests des trois services (l'aperçu des versions d'une PR est dans release-preview.yml).
# release.yml appelle ce workflow (workflow_call) : les tests conditionnent la release
# et le déploiement, et ne tournent pas deux fois par commit.
on:
  pull_request:
  workflow_call:
    inputs:
      api_front:
        description: "Tester l'API et le front"
        type: boolean
        default: true
      agent:
        description: "Tester l'agent (talks-agent)"
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      api_front:
        description: "API et front"
        type: boolean
        default: true
      agent:
        description: "Agent (talks-agent)"
        type: boolean
        default: true

# Une seule exécution par branche/PR : les runs obsolètes sont annulés,
# sauf sur main où chaque commit doit être validé jusqu'au bout.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # Sur une PR, pas d'inputs : tout est testé.
  api:
    name: API (Quarkus)
    if: ${{ github.event_name == 'pull_request' || inputs.api_front }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      # `verify` enchaîne spotless:check (phase validate), la compilation,
      # les tests unitaires et le build Quarkus (quarkus:build).
      - name: Build & tests
        run: ./mvnw -B -ntp verify

      # Résumé des tests Surefire dans le job summary (équivalent du rapport Vitest côté front).
      - name: Résumé des tests API
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6.6.1
        with:
          report_paths: api/target/surefire-reports/TEST-*.xml
          check_name: API test report
          # Pas de check run créé : évite d'avoir besoin de la permission checks: write
          annotate_only: true
          detailed_summary: true

      # `verify` régénère target/openapi/openapi.json depuis les annotations JAX-RS.
      # La copie versionnée (api/openapi.json) doit être strictement identique.
      - name: Vérification de la synchronisation du contrat OpenAPI
        run: |
          cmp -s target/openapi/openapi.json openapi.json \
            || { echo "::error::api/openapi.json est obsolète. Lancez './mvnw package -DskipTests && cp target/openapi/openapi.json openapi.json' et committez le résultat."; exit 1; }

      - name: Upload des rapports de tests en cas d'échec
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-surefire-reports
          path: api/target/surefire-reports/
          retention-days: 7

  front:
    name: Front (Next.js)
    if: ${{ github.event_name == 'pull_request' || inputs.api_front }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # front/.nvmrc fait foi ; garder le Dockerfile aligné (node:<version>-alpine).
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: front/.nvmrc
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Cache Next.js build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            front/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('front/package-lock.json') }}-${{ hashFiles('front/**/*.ts', 'front/**/*.tsx', 'front/**/*.js', 'front/**/*.jsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('front/package-lock.json') }}-

      # `npm ci` échoue si package.json et package-lock.json divergent :
      # c'est le premier filet de sécurité sur les PR Dependabot.
      - name: Install
        run: npm ci

      # Régénère shared/api/schema.d.ts, shared/api/enums.ts et shared/api/contract.ts depuis api/openapi.json.
      - name: Régénération des types du contrat
        run: npm run generate:api

      # Les fichiers générés sont versionnés : ils doivent correspondre à api/openapi.json.
      - name: Vérification de la synchronisation des types générés
        run: |
          git diff --exit-code -- shared/api \
            || { echo "::error::front/shared/api est obsolète. Lancez 'npm run generate:api' et committez le résultat."; exit 1; }

      - name: Lint
        run: npm run lint

      - name: Tests frontend
        run: npm test

      # `next build` fait aussi le type-check TypeScript.
      - name: Build
        run: npm run build

  agent:
    name: Agent (talks-agent)
    if: ${{ github.event_name == 'pull_request' || inputs.agent }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agents/talks-agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installer uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          cache-dependency-glob: agents/talks-agent/uv.lock

      - name: Installer les dépendances
        run: uv sync --locked

      - name: Tests unitaires
        run: uv run pytest tests/unit
