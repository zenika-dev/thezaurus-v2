name: CI

# Sur main, c'est release.yml qui appelle ce workflow (workflow_call) : les tests
# conditionnent le déploiement et ne tournent pas deux fois par commit.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

# Une seule exécution par branche/PR : les runs obsolètes sont annulés,
# sauf sur main où chaque commit doit être validé jusqu'au bout.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  api:
    name: API (Quarkus)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      # `verify` enchaîne spotless:check (phase validate), la compilation,
      # les tests unitaires et le build Quarkus (quarkus:build).
      - name: Build & tests
        run: ./mvnw -B -ntp verify

      # Résumé des tests Surefire dans le job summary (équivalent du rapport Vitest côté front).
      - name: Résumé des tests API
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: api/target/surefire-reports/TEST-*.xml
          check_name: API test report
          # Pas de check run créé : évite d'avoir besoin de la permission checks: write
          annotate_only: true
          detailed_summary: true

      # `verify` régénère target/openapi/openapi.json depuis les annotations JAX-RS.
      # La copie versionnée (api/openapi.json) doit être strictement identique.
      - name: Vérification de la synchronisation du contrat OpenAPI
        run: |
          cmp -s target/openapi/openapi.json openapi.json \
            || { echo "::error::api/openapi.json est obsolète. Lancez './mvnw package -DskipTests && cp target/openapi/openapi.json openapi.json' et committez le résultat."; exit 1; }

      - name: Upload des rapports de tests en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: api-surefire-reports
          path: api/target/surefire-reports/
          retention-days: 7

  front:
    name: Front (Next.js)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # front/.nvmrc fait foi ; garder le Dockerfile aligné (node:<version>-alpine).
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: front/.nvmrc
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: |
            front/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('front/package-lock.json') }}-${{ hashFiles('front/**/*.ts', 'front/**/*.tsx', 'front/**/*.js', 'front/**/*.jsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('front/package-lock.json') }}-

      # `npm ci` échoue si package.json et package-lock.json divergent :
      # c'est le premier filet de sécurité sur les PR Dependabot.
      - name: Install
        run: npm ci

      # Régénère shared/api/schema.d.ts, shared/api/enums.ts et shared/api/contract.ts depuis api/openapi.json.
      - name: Régénération des types du contrat
        run: npm run generate:api

      # Les fichiers générés sont versionnés : ils doivent correspondre à api/openapi.json.
      - name: Vérification de la synchronisation des types générés
        run: |
          git diff --exit-code -- shared/api \
            || { echo "::error::front/shared/api est obsolète. Lancez 'npm run generate:api' et committez le résultat."; exit 1; }

      - name: Lint
        run: npm run lint

      - name: Tests frontend
        run: npm test

      # `next build` fait aussi le type-check TypeScript.
      - name: Build
        run: npm run build
