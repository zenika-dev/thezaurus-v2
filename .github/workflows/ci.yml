name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Une seule exécution par branche/PR : les runs obsolètes sont annulés.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Reformate l'API et régénère le contrat OpenAPI (spec + types front), puis pousse les
  # correctifs sur la branche de la PR : ni le formatage ni la fraîcheur du contrat n'ont
  # à être corrigés à la main. Un seul job, un seul checkout, des commits séquentiels — deux
  # jobs qui pousseraient en parallèle sur la même branche se bloqueraient l'un l'autre.
  #
  # Chaque commit auto-généré porte [skip ci] : un push sur une branche de PR déclenche un
  # `pull_request: synchronize`, qui relance ce workflow sur le même groupe de concurrence
  # (`ci-CI-<ref-de-la-PR>`, stable entre synchronize) — et `cancel-in-progress: true`
  # annulerait alors CE run en plein milieu, avant les commits suivants ou les jobs
  # `api`/`front`. [skip ci] empêche ce nouveau run de démarrer ; le run courant continue
  # normalement et ses jobs `api`/`front` verront bien l'état final une fois `format` terminé.
  format:
    name: Auto-fix (formatage + contrat OpenAPI)
    # Le GITHUB_TOKEN est en lecture seule sur les PR issues d'un fork : on ne
    # tente le commit que pour les branches du dépôt. Les forks restent couverts
    # par les vérifications (spotless:check, contrat à jour) des jobs `api`/`front`.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Setup Node 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Configuration git (commits automatiques)
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Application du formatage
        run: ./mvnw -B -ntp spotless:apply

      - name: Commit si le formatage a modifié des fichiers
        working-directory: .
        run: |
          if git diff --quiet; then
            echo "Aucun écart de formatage."
            exit 0
          fi
          git commit -am "style(api): applique le formatage spotless [skip ci]"
          git push

      # Même build que le job `api`, sans les tests : seul target/openapi/openapi.json
      # nous intéresse ici, dérivé des annotations JAX-RS déjà reformatées à l'étape précédente.
      - name: Génération du contrat OpenAPI
        run: ./mvnw -B -ntp package -DskipTests

      - name: Commit si le contrat OpenAPI a changé
        working-directory: .
        run: |
          cp api/target/openapi/openapi.json api/openapi.json
          if git diff --quiet -- api/openapi.json; then
            echo "Contrat OpenAPI déjà à jour."
            exit 0
          fi
          git add api/openapi.json
          git commit -m "chore(contract): met à jour api/openapi.json [skip ci]"
          git push

      - name: Install (front)
        working-directory: front
        run: npm ci

      # Régénère schema.d.ts et enums.ts depuis le contrat, potentiellement mis à jour
      # par l'étape précédente.
      - name: Régénération des types du contrat
        working-directory: front
        run: npm run generate:api

      - name: Commit si les types générés ont changé
        working-directory: .
        run: |
          if git diff --quiet -- front/shared/api/schema.d.ts front/shared/api/enums.ts; then
            echo "Types du contrat déjà à jour."
            exit 0
          fi
          git add front/shared/api/schema.d.ts front/shared/api/enums.ts
          git commit -m "chore(contract): régénère les types TypeScript du contrat [skip ci]"
          git push

  api:
    name: API (Quarkus)
    runs-on: ubuntu-latest
    # Attend le job de formatage pour vérifier le code déjà reformaté, sinon la
    # PR afficherait un échec spotless que le commit automatique vient de corriger.
    needs: [format]
    # `needs` seul suffirait à sauter ce job quand `format` est sauté (push sur
    # main, PR de fork) : cette condition le fait tourner malgre tout.
    if: ${{ !cancelled() && (needs.format.result == 'success' || needs.format.result == 'skipped') }}
    defaults:
      run:
        working-directory: api
    steps:
      # Par son nom de branche, donc avec le commit de formatage s'il a eu lieu.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      # `verify` enchaîne spotless:check (phase validate), la compilation,
      # les tests unitaires et le build Quarkus (quarkus:build).
      - name: Build & tests
        run: ./mvnw -B -ntp verify

      # `verify` régénère target/openapi/openapi.json depuis les annotations JAX-RS.
      # La copie versionnée doit être identique : c'est elle qui sert de source aux types
      # TypeScript du front, et son diff rend toute évolution du contrat visible en revue.
      - name: Contrat OpenAPI à jour
        run: |
          cp target/openapi/openapi.json openapi.json
          git diff --exit-code openapi.json \
            || { echo "::error::api/openapi.json est obsolète. Lancez './mvnw package -DskipTests' puis 'cp target/openapi/openapi.json openapi.json' et committez le résultat."; exit 1; }

      - name: Upload des rapports de tests en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: api-surefire-reports
          path: api/target/surefire-reports/
          retention-days: 7

  front:
    name: Front (Next.js)
    runs-on: ubuntu-latest
    # Le job `format` régénère aussi schema.d.ts/enums.ts : sans cette dépendance, ce job
    # checkerait la branche avant le push de `format` et échouerait sur un contrat périmé
    # pour de mauvaises raisons.
    needs: [format]
    if: ${{ !cancelled() && (needs.format.result == 'success' || needs.format.result == 'skipped') }}
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      # Même version majeure que le Dockerfile (node:20-alpine).
      - name: Setup Node 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: front/package-lock.json

      # `npm ci` échoue si package.json et package-lock.json divergent :
      # c'est le premier filet de sécurité sur les PR Dependabot.
      - name: Install
        run: npm ci

      # Régénère types et enums depuis api/openapi.json (versionné, donc pas besoin du build
      # Maven ici : les jobs `api` et `front` restent indépendants).
      - name: Types du contrat à jour
        run: |
          npm run generate:api
          git diff --exit-code shared/api/schema.d.ts shared/api/enums.ts \
            || { echo "::error::Les types générés sont obsolètes. Lancez 'npm run generate:api' et committez le résultat."; exit 1; }

      - name: Lint
        run: npm run lint

      # `next build` fait aussi le type-check TypeScript.
      - name: Build
        run: npm run build
