# TEMPORAIRE — test de infra-env.yml avant merge. À SUPPRIMER une fois le test fait.
# Le bouton "Run workflow" n'existe que pour un workflow présent sur main. Pour lancer le test
# à la demande depuis la branche, pousser un commit dont le message contient [infra-test] :
#   git commit --allow-empty -m "test [infra-test]" && git push
# Lance infra-env.yml en plan staging : rien n'est modifié dans GCP.
name: Infra Env (test avant merge)

on:
  push:
    branches: [feat/iac-terraform]

permissions:
  contents: read

jobs:
  plan-staging:
    if: ${{ contains(github.event.head_commit.message, '[infra-test]') }}
    uses: ./.github/workflows/infra-env.yml
    permissions:
      contents: read
      id-token: write
      actions: read
    with:
      environment: staging
      action: plan
