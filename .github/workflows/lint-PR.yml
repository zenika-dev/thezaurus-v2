name: 'Lint PR'

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize

# Aucune permission par défaut : le job ne demande que ce dont il a besoin.
permissions: {}

jobs:
  main:
    name: Validate PR title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          validateSingleCommit: true
          validateSingleCommitMatchesPrTitle: true
      - if: failure()
        run: >-
          echo "::error title=Titre de PR invalide::Format attendu 'type(scope): description', ex. 'feat(front): ajoute la recherche'. Types - feat, fix, perf, revert, docs, style, refactor, test, build, ci, chore. Voir https://www.conventionalcommits.org/fr/v1.0.0/"
