name: Release

# Chaîne de livraison : tests → release (tags, releases GitHub) → images / agent → déploiement.
# Rien n'est publié ni déployé si un test du même commit échoue.
# - main : release stable (1.5.0), déployable en staging puis promue en production (même version, même image).
# - autre branche : prerelease (1.5.0-feat-x.1), déployable en staging uniquement.
on:
  workflow_dispatch:
    # Cocher les deux pour tout livrer.
    inputs:
      api_front:
        description: "API et front"
        type: boolean
        default: true
      agent:
        description: "Agent (talks-agent, production uniquement)"
        type: boolean
        default: true
      environment:
        description: "Environnement cible (production : depuis main uniquement)"
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Refuse la production hors de main, avant tout test ou publication.
  guard:
    name: Vérifier la branche (prod = main)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Production depuis main uniquement
        env:
          TARGET_ENV: ${{ inputs.environment }}
          REF: ${{ github.ref }}
        run: |
          if [ "${TARGET_ENV}" = "production" ] && [ "${REF}" != "refs/heads/main" ]; then
            echo "::error::La production ne se déploie que depuis main (ref actuelle : ${REF})"
            exit 1
          fi

  # Tests des services cochés, en parallèle.
  ci:
    needs: [guard]
    if: ${{ inputs.api_front || inputs.agent }}
    uses: ./.github/workflows/ci.yml
    with:
      api_front: ${{ inputs.api_front }}
      agent: ${{ inputs.agent }}

  # Une release par service (tags api-vX.Y.Z / front-vX.Y.Z / agents-vX.Y.Z) sur main,
  # une prerelease (api-vX.Y.Z-<branche>.N) sur les autres branches (cf. .releaserc.json).
  release:
    name: Semantic release
    needs: [ci]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      api_version: ${{ steps.release.outputs.api_version }}
      front_version: ${{ steps.release.outputs.front_version }}
      agents_version: ${{ steps.release.outputs.agents_version }}
    steps:
      # Le commit testé par ci, avec tout l'historique et les tags (calcul des versions).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Services à publier
        id: services
        env:
          API_FRONT: ${{ inputs.api_front }}
          AGENT: ${{ inputs.agent }}
        run: |
          services=()
          [ "${API_FRONT}" = "true" ] && services+=(api front)
          [ "${AGENT}" = "true" ] && services+=(agents)
          echo "list=${services[*]}" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/semantic-release
        id: release
        with:
          services: ${{ steps.services.outputs.list }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  version:
    uses: ./.github/workflows/_version.yml

  # Image taguée avec la version semantic-release du service (ex. 1.2.0).
  # Sans version (aucune release encore publiée), pas d'image.
  image-api:
    needs: [release]
    if: ${{ inputs.api_front && needs.release.outputs.api_version != '' }}
    uses: ./.github/workflows/_image-api.yml
    permissions:
      contents: read
      id-token: write
    with:
      version: ${{ needs.release.outputs.api_version }}

  image-front:
    needs: [release]
    if: ${{ inputs.api_front && needs.release.outputs.front_version != '' }}
    uses: ./.github/workflows/_image-front.yml
    permissions:
      contents: read
      id-token: write
    with:
      version: ${{ needs.release.outputs.front_version }}

  # Images référencées par digest (immuables) : ce qui est déployé est exactement
  # ce qui a été construit, même si un tag est réécrit entre-temps.
  # La config de l'env vient de .github/envs/<environment>.env.
  deploy:
    needs: [version, image-api, image-front]
    uses: ./.github/workflows/_deploy.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: ${{ inputs.environment }}
      version: ${{ needs.version.outputs.version }}
      api_image: ${{ needs.image-api.outputs.image }}
      front_image: ${{ needs.image-front.outputs.image }}

  # En parallèle des images et du déploiement Cloud Run.
  # L'agent n'a pas d'env staging : il n'est déployé qu'en production.
  deploy-agent:
    needs: [release]
    if: ${{ inputs.agent && inputs.environment == 'production' && needs.release.outputs.agents_version != '' }}
    uses: ./.github/workflows/_deploy-agent.yml
    permissions:
      contents: read
      id-token: write
    with:
      version: ${{ needs.release.outputs.agents_version }}

  # Release GitHub globale (vAAAA.MM.JJ-<sha>) qui regroupe les notes api/front/agents.
  # Seulement une fois la prod à jour : au moins un déploiement réussi, aucun en échec.
  umbrella-release:
    needs: [version, release, deploy, deploy-agent]
    if: >-
      ${{ !cancelled()
        && inputs.environment == 'production'
        && !contains(needs.*.result, 'failure')
        && (needs.deploy.result == 'success' || needs.deploy-agent.result == 'success') }}
    uses: ./.github/workflows/_umbrella-release.yml
    permissions:
      contents: write
    with:
      version: ${{ needs.version.outputs.version }}
