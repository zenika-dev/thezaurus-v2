name: Release

# Chaîne de prod : tests → images → déploiement Cloud Run.
# Une image n'est construite (et poussée) que si les tests du même commit sont verts.
on:
  push:
    # TODO: retirer feat/connect-to-gcp avant de merger (branche de mise au point)
    branches: [main, feat/connect-to-gcp]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  version:
    uses: ./.github/workflows/_version.yml

  image-api:
    needs: [ci, version]
    uses: ./.github/workflows/_image-api.yml
    permissions:
      contents: read
      id-token: write
    with:
      version: ${{ needs.version.outputs.version }}

  image-front:
    needs: [ci, version]
    uses: ./.github/workflows/_image-front.yml
    permissions:
      contents: read
      id-token: write
    with:
      version: ${{ needs.version.outputs.version }}

  # Images référencées par digest (immuables) : ce qui est déployé est exactement
  # ce qui a été construit, même si un tag est réécrit entre-temps.
  deploy-production:
    needs: [version, image-api, image-front]
    uses: ./.github/workflows/_deploy.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: production
      version: ${{ needs.version.outputs.version }}
      api_image: ${{ needs.image-api.outputs.image }}
      front_image: ${{ needs.image-front.outputs.image }}
