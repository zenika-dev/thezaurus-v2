name: Release

# Chaîne de prod : tests → images (en parallèle des tests) → déploiement Cloud Run.
# Une image n'est déployée que si les tests du même commit sont verts.
on:
  push:
    # TODO: retirer feat/connect-to-gcp avant de merger (branche de mise au point)
    branches: [main, feat/connect-to-gcp]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
#  ci:
#    uses: ./.github/workflows/ci.yml

  version:
    uses: ./.github/workflows/_version.yml

  build-api:
    needs: version
    uses: ./.github/workflows/_build-api.yml
    permissions:
      contents: read
      id-token: write
    with:
      version: ${{ needs.version.outputs.version }}

  build-front:
    needs: version
    uses: ./.github/workflows/_build-front.yml
    permissions:
      contents: read
      id-token: write
    with:
      version: ${{ needs.version.outputs.version }}

  # Images référencées par digest (immuables) : ce qui est déployé est exactement
  # ce qui a été construit, même si un tag est réécrit entre-temps.
  deploy-production:
    needs: [  version, build-api, build-front]
    # Seul main déploie : les autres branches s'arrêtent au push des images
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/_deploy.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: production
      version: ${{ needs.version.outputs.version }}
      api_image: ${{ needs.build-api.outputs.image }}
      front_image: ${{ needs.build-front.outputs.image }}
