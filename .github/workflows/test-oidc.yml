name: Test OIDC

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform,https://www.googleapis.com/auth/userinfo.email

      - name: Show token info
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          curl -s -d "access_token=${TOKEN}" \
            https://oauth2.googleapis.com/tokeninfo | jq '{email, expires_in, scope}'