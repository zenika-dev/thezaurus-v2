# Port HTTP de l'agent de génération de visuels
quarkus.http.port=${VISUALS_AGENT_PORT:8082}

# Configuration CORS
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS

# Configuration du modèle Google GenAI (Gemini 4 Argon par défaut)
visuals.gemini.model=${GEMINI_MODEL:gemini-4-argon}
visuals.gemini.api-key=${GOOGLE_API_KEY:}
visuals.gemini.vertex-ai=${GOOGLE_GENAI_USE_VERTEXAI:false}
visuals.gemini.project=${GOOGLE_CLOUD_PROJECT_ID:}
visuals.gemini.location=${GOOGLE_CLOUD_LOCATION:europe-west1}
# Timeout de l'appel HTTP vers l'API Gemini (en millisecondes)
visuals.gemini.timeout-ms=${GEMINI_TIMEOUT_MS:120000}

# Répertoire optionnel sur le système de fichiers contenant des templates personnalisés
# (s'il est vide ou absent, les templates sont chargés depuis le classpath src/main/resources/templates)
visuals.templates.dir=${VISUALS_TEMPLATES_DIR:}

# Fréquence des événements heartbeat SSE pendant la génération (en millisecondes)
visuals.sse.heartbeat-interval-ms=${VISUALS_SSE_HEARTBEAT_MS:3000}

# Contrat OpenAPI
quarkus.smallrye-openapi.info-title=TheZaurus Visuals Agent API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.auto-add-server=false
