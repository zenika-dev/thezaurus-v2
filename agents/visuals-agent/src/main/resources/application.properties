quarkus.http.port=${VISUALS_AGENT_PORT:8087}
quarkus.http.host=${VISUALS_AGENT_HOST:127.0.0.1}
# Three photos of up to 10 MiB each, with base64 overhead and JSON metadata.
quarkus.http.limits.max-body-size=42M
quarkus.jackson.fail-on-unknown-properties=true
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.info-title=Visuals Agent
quarkus.smallrye-openapi.info-description=Rendu autonome des templates de communication. Gemini analyse les photos ; Java produit les PNG.
quarkus.smallrye-openapi.info-version=1.0.0
visuals.api-key=${VISUALS_API_KEY:}
visuals.api-keys-json=${VISUALS_API_KEYS_JSON:}
visuals.require-api-key=${VISUALS_REQUIRE_API_KEY:false}
visuals.crop.enabled=${VISUALS_AI_ENABLED:true}
visuals.crop.model=${GEMINI_CROP_MODEL:gemini-3.1-flash-lite}
visuals.crop.api-key=${GOOGLE_API_KEY:${GEMINI_API_KEY:}}
visuals.crop.project=${GOOGLE_CLOUD_PROJECT_ID:${GOOGLE_CLOUD_PROJECT:}}
visuals.crop.location=${GOOGLE_CLOUD_LOCATION:${GCP_REGION:global}}
visuals.crop.credentials-file=${GOOGLE_APPLICATION_CREDENTIALS:${GCLOUD_ADC:}}
visuals.crop.max-attempts=3
visuals.crop.timeout-ms=20000
%test.visuals.crop.enabled=false
%test.quarkus.http.test-port=0
