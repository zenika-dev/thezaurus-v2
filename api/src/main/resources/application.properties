# Configuration Google Cloud (Production / Docker)
quarkus.google.cloud.project-id=${GOOGLE_CLOUD_PROJECT_ID}
quarkus.google.cloud.firestore.database-id=${FIRESTORE_DATABASE_ID:thezaurus-dev}
quarkus.google.cloud.credentials.type=service-account
quarkus.google.cloud.credentials.location=${GOOGLE_APPLICATION_CREDENTIALS}

# --- Configuration spécifique au mode 'quarkus dev' (local) ---
# Forcer l'utilisation de l'émulateur sur le port 9000
%dev.quarkus.google.cloud.project-id=local-dev
%dev.quarkus.google.cloud.firestore.database-id=(default)
%dev.quarkus.google.cloud.firestore.emulator.host=localhost:9000
%dev.quarkus.google.cloud.firestore.emulator-host=localhost:9000
%dev.FIRESTORE_EMULATOR_HOST=localhost:9000

# Désactiver les credentials explicites pour le mode dev
%dev.quarkus.google.cloud.credentials.type=default
%dev.quarkus.http.port=8080

# Configuration CORS for development
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
%dev.quarkus.http.cors.enabled=true
%dev.quarkus.http.cors.origins=*

# --- Configuration JWT (Google Cloud IAP) ---
mp.jwt.verify.publickey.location=https://www.gstatic.com/iap/verify/public_key
mp.jwt.verify.issuer=https://cloud.google.com/iap
mp.jwt.verify.audiences=${GOOGLE_IAP_AUDIENCE:dummy-audience}
smallrye.jwt.token.header=x-goog-iap-jwt-assertion

%dev.mp.jwt.verify.publickey.location=https://www.googleapis.com/oauth2/v3/certs
%dev.mp.jwt.verify.issuer=https://accounts.google.com
%dev.mp.jwt.verify.audiences=${GOOGLE_CLIENT_ID:dummy-client-id}
%dev.mp.jwt.token.header=Authorization
%dev.quarkus.smallrye-jwt.enabled=true
%dev.mock.auth=false

# Préfixe pour les collections Firestore (laissé vide par défaut, ex: dev)
thezaurus.firestore.collection.prefix=${FIRESTORE_COLLECTION_PREFIX:}
