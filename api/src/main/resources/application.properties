# Configuration Google Cloud (Production / Docker)
# Les credentials ne se configurent pas ici : c'est le mécanisme Application Default
# Credentials natif de Google qui s'applique (variable d'environnement
# GOOGLE_APPLICATION_CREDENTIALS en local Docker, metadata server sur Cloud Run).
quarkus.google.cloud.project-id=${GOOGLE_CLOUD_PROJECT_ID}
quarkus.google.cloud.firestore.database-id=${FIRESTORE_DATABASE_ID:thezaurus-dev}

# --- Configuration spécifique au profil dev (émulateur Firestore) ---
%dev.quarkus.google.cloud.project-id=local-dev
%dev.quarkus.google.cloud.firestore.database-id=(default)
# Émulateur sur localhost:9000 (mode `quarkus:dev` local) ;
# docker-compose passe FIRESTORE_HOST_OVERRIDE=firestore:9000 pour les conteneurs
%dev.quarkus.google.cloud.firestore.host-override=${FIRESTORE_HOST_OVERRIDE:localhost:9000}
# Force le mode émulateur (connexion en clair, credentials factices) même quand
# l'hôte n'est pas "localhost" (cas Docker : firestore:9000)
%dev.quarkus.google.cloud.firestore.use-emulator-credentials=true

%dev.quarkus.http.port=8080

# Configuration CORS for development
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
%dev.quarkus.http.cors.enabled=true
%dev.quarkus.http.cors.origins=*

# --- Configuration JWT (Google Sign-In, identique en dev et en prod local) ---
mp.jwt.verify.publickey.location=https://www.googleapis.com/oauth2/v3/certs
mp.jwt.verify.issuer=https://accounts.google.com
mp.jwt.verify.audiences=${GOOGLE_CLIENT_ID:dummy-client-id}
mp.jwt.token.header=Authorization
quarkus.smallrye-jwt.enabled=true

# Préfixe pour les collections Firestore (laissé vide par défaut, ex: dev)
thezaurus.firestore.collection.prefix=${FIRESTORE_COLLECTION_PREFIX:}

# Configuration slack (facultative : si absente, le bot Slack est simplement désactivé au démarrage)
thezaurus.slack.app-token=${SLACK_APP_TOKEN:}
thezaurus.slack.bot-token=${SLACK_BOT_TOKEN:}
thezaurus.slack.signing-secret=${SLACK_SIGNING_SECRET:}

# Configuration Agent IA Vertex AI Reasoning Engine
thezaurus.reasoning-engine.url=${REASONING_ENGINE_URL:https://europe-west1-aiplatform.googleapis.com/v1/projects/thezaurus-494709/locations/europe-west1/reasoningEngines/217923204625203200:streamQuery?alt=sse}
# Migrations de donnees au demarrage (idempotentes) - desactivees en test : Firestore y est mocke
%test.thezaurus.migrations.startup=false

# --- Contrat OpenAPI ---
# Écrit la spec dérivée des annotations JAX-RS dans target/openapi/ à chaque build, sans avoir à
# démarrer l'application. La copie versionnée (api/openapi.json) sert de source à la génération
# des types TypeScript du front (front/shared/api/schema.d.ts).
quarkus.smallrye-openapi.store-schema-directory=target/openapi
quarkus.smallrye-openapi.info-title=Thezaurus API
# Sans cela, SmallRye injecte un bloc `servers` déduit de l'hôte et du port courants : le contenu
# du fichier dépendrait de l'environnement de build et produirait des diffs parasites. Le front
# passe de toute façon par son proxy /api/backend.
quarkus.smallrye-openapi.auto-add-server=false

thezaurus.public-url=${THEZAURUS_PUBLIC_URL:http://localhost:3000}

# --- Rappel post-talk et configuration SMTP ---
# Activé via FEEDBACK_REMINDER_ENABLED=true. Sans activation ou expéditeur, aucun rappel n'est envoyé.
thezaurus.feedback-reminder.enabled=${FEEDBACK_REMINDER_ENABLED:false}
thezaurus.feedback-reminder.cron=${FEEDBACK_REMINDER_CRON:0 0 9 * * ?}
thezaurus.feedback-reminder.time-zone=${FEEDBACK_REMINDER_TIME_ZONE:Europe/Paris}

quarkus.mailer.host=${SMTP_HOST:localhost}
quarkus.mailer.port=${SMTP_PORT:1025}
quarkus.mailer.from=${SMTP_FROM:}
quarkus.mailer.username=${SMTP_USERNAME:}
quarkus.mailer.password=${SMTP_PASSWORD:}
quarkus.mailer.login=${SMTP_LOGIN:NONE}
quarkus.mailer.tls=${SMTP_TLS:false}
quarkus.mailer.start-tls=${SMTP_START_TLS:DISABLED}
quarkus.mailer.mock=${SMTP_MOCK:false}

# En mode dev hors Docker Compose, la simulation en mémoire reste active par défaut si non spécifié
%dev.quarkus.mailer.mock=${SMTP_MOCK:true}

# Aucun SMTP ni déclenchement automatique en test.
%test.quarkus.scheduler.enabled=false
%test.quarkus.mailer.mock=true
