_metadata:
  major_version: 1
  minor_version: 1
display_information:
  name: TheZaurus
  description: Application et bot Slack pour la gestion et le suivi des talks TheZaurus
features:
  bot_user:
    display_name: TheZaurus
    always_online: false
  slash_commands:
    - command: /talk
      url: https://your-url.zenika.com/slack/events
      description: Ajouter un talk
      should_escape: false
oauth_config:
  redirect_urls:
    - https://your-url.zenika.com
  scopes:
    bot:
      - commands
      # users:read : lecture des informations des utilisateurs/speakers
      - users:read
      # users:read.email : lecture de l'email pour rattacher les speakers aux utilisateurs TheZaurus
      - users:read.email
      # chat:write : envoi des messages directs de rappel de feedback post-talk
      - chat:write
  pkce_enabled: false
settings:
  interactivity:
    is_enabled: true
    request_url: https://your-url.zenika.com/slack/events
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
  is_mcp_enabled: false
