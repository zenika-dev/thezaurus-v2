services:
  visuals-agent:
    build:
      context: ./agents/visuals-agent
      dockerfile: src/main/docker/Dockerfile.jvm
    # Bootstrap copies private ADC to tmpfs, then drops to UID/GID 10001 before Java.
    user: "0:0"
    tmpfs:
      - /run/visuals:mode=0700,uid=10001,gid=10001
    environment:
      - GOOGLE_CLOUD_PROJECT_ID=${GOOGLE_CLOUD_PROJECT_ID:-}
      - GOOGLE_CLOUD_LOCATION=${GOOGLE_CLOUD_LOCATION:-global}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-${GEMINI_API_KEY:-}}
      - GEMINI_CROP_MODEL=${GEMINI_CROP_MODEL:-gemini-3.1-flash-lite}
      - VISUALS_AI_ENABLED=${VISUALS_AI_ENABLED:-true}
      - VISUALS_API_KEY=${VISUALS_API_KEY:-}
      - GOOGLE_APPLICATION_CREDENTIALS=/run/visuals/credentials.json
      - VISUALS_ADC_SOURCE=/run/host-credentials.json
    volumes:
      - ${GCLOUD_ADC:-${HOME}/.config/gcloud/application_default_credentials.json}:/run/host-credentials.json:ro

  gcs:
    image: fsouza/fake-gcs-server:1.56.1
    container_name: thezaurus-gcs-emulator
    entrypoint: ["/bin/sh", "-c"]
    command:
      - mkdir -p /data/thezaurus-photos-local && exec /bin/fake-gcs-server -scheme http -port 4443 -backend filesystem -filesystem-root /storage -data /data -external-url http://gcs:4443
    ports:
      - "127.0.0.1:4443:4443"
    volumes:
      - gcs-data:/storage
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:4443/storage/v1/b/thezaurus-photos-local"]
      interval: 5s
      timeout: 5s
      retries: 10
  # Boîte SMTP locale : tous les emails restent consultables dans Mailpit.
  mailpit:
    image: axllent/mailpit:v1.27.4
    container_name: thezaurus-mailpit
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
    environment:
      MP_SMTP_AUTH: "${SMTP_USERNAME:-thezaurus}:${SMTP_PASSWORD:-thezaurus-local}"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Émulateur Firestore local (absent quand on lance docker-compose.yml seul, en mode prod)
  # Firebase Emulator Suite (firebase-tools) plutôt que le nu `gcloud emulators` :
  # expose en plus l'Emulator UI officielle (http://localhost:4000) pour parcourir les données.
  firestore:
    image: andreysenov/firebase-tools:15.30.2
    container_name: thezaurus-firestore-emulator
    command: firebase emulators:start --project=local-dev
    ports:
      - "9000:9000"
      - "4000:4000" # Emulator UI (http://localhost:4000)
      - "4400:4400" # Emulator Hub — nécessaire pour l'auto-détection par des clients externes (ex. Firestudio)
      - "9150:9150" # Websocket interne de l'Emulator UI (onglet "Requests")
    volumes:
      - ./firebase.json:/home/node/firebase.json:ro
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:9000', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    environment:
      - VISUALS_AGENT_URL=http://visuals-agent:8087
      - VISUALS_API_KEY=${VISUALS_API_KEY:-}
      - VISUALS_AGENT_TIMEOUT=${VISUALS_AGENT_TIMEOUT:-PT120S}
      - QUARKUS_PROFILE=dev
      - PROFILE_PHOTOS_BUCKET=thezaurus-photos-local
      - GCS_EMULATOR_HOST=http://gcs:4443
      - FIRESTORE_HOST_OVERRIDE=firestore:9000
      - SMTP_HOST=${SMTP_HOST:-mailpit}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - SMTP_FROM=${SMTP_FROM:-thezaurus@local.test}
      - SMTP_USERNAME=${SMTP_USERNAME:-thezaurus}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-thezaurus-local}
      - SMTP_LOGIN=${SMTP_LOGIN:-REQUIRED}
      - SMTP_TLS=${SMTP_TLS:-false}
      - SMTP_START_TLS=${SMTP_START_TLS:-DISABLED}
      - SMTP_MOCK=${SMTP_MOCK:-false}
      - FEEDBACK_REMINDER_ENABLED=${FEEDBACK_REMINDER_ENABLED:-true}
      - FEEDBACK_REMINDER_CRON=${FEEDBACK_REMINDER_CRON:-0 0 9 * * ?}
      - FEEDBACK_REMINDER_TIME_ZONE=${FEEDBACK_REMINDER_TIME_ZONE:-Europe/Paris}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-dummy-client-id}
    depends_on:
      visuals-agent:
        condition: service_started
      gcs:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      firestore:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/q/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  front:
    build:
      target: dev
    container_name: thezaurus-front
    ports:
      - "3000:3000"
    volumes:
      - ./api/openapi.json:/api/openapi.json:ro
    environment:
      - API_URL=http://api:8080
      - VITE_MOCK_AUTH=false
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-your-google-client-id.apps.googleusercontent.com}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
    depends_on:
      api:
        condition: service_healthy
    x-google-cloudrun: null
    develop:
      watch:
        - action: sync
          path: ./front
          target: /app
          ignore:
            - node_modules/
            - .next/
        - action: rebuild
          path: ./front/package.json
        - action: rebuild
          path: ./front/package-lock.json

volumes:
  gcs-data:
