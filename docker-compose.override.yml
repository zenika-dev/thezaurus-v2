services:
  # Boîte SMTP locale : tous les emails restent consultables dans Mailpit.
  mailpit:
    image: axllent/mailpit:v1.27.4
    container_name: thezaurus-mailpit
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
    environment:
      MP_SMTP_AUTH: "${SMTP_USERNAME:-thezaurus}:${SMTP_PASSWORD:-thezaurus-local}"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Émulateur Firestore local (absent quand on lance docker-compose.yml seul, en mode prod)
  # Firebase Emulator Suite (firebase-tools) plutôt que le nu `gcloud emulators` :
  # expose en plus l'Emulator UI officielle (http://localhost:4000) pour parcourir les données.
  firestore:
    image: andreysenov/firebase-tools:15.30.2
    container_name: thezaurus-firestore-emulator
    command: firebase emulators:start --project=local-dev
    ports:
      - "9000:9000"
      - "4000:4000" # Emulator UI (http://localhost:4000)
      - "4400:4400" # Emulator Hub — nécessaire pour l'auto-détection par des clients externes (ex. Firestudio)
      - "9150:9150" # Websocket interne de l'Emulator UI (onglet "Requests")
    volumes:
      - ./firebase.json:/home/node/firebase.json:ro
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:9000', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    environment:
      - QUARKUS_PROFILE=dev
      - FIRESTORE_HOST_OVERRIDE=firestore:9000
      - SMTP_HOST=${SMTP_HOST:-mailpit}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - SMTP_FROM=${SMTP_FROM:-thezaurus@local.test}
      - SMTP_USERNAME=${SMTP_USERNAME:-thezaurus}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-thezaurus-local}
      - SMTP_LOGIN=${SMTP_LOGIN:-REQUIRED}
      - SMTP_TLS=${SMTP_TLS:-false}
      - SMTP_START_TLS=${SMTP_START_TLS:-DISABLED}
      - SMTP_MOCK=${SMTP_MOCK:-false}
      - FEEDBACK_REMINDER_ENABLED=${FEEDBACK_REMINDER_ENABLED:-true}
      - FEEDBACK_REMINDER_CRON=${FEEDBACK_REMINDER_CRON:-0 0 9 * * ?}
      - FEEDBACK_REMINDER_TIME_ZONE=${FEEDBACK_REMINDER_TIME_ZONE:-Europe/Paris}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-dummy-client-id}
    depends_on:
      mailpit:
        condition: service_healthy
      firestore:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/q/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  front:
    build:
      target: dev
    container_name: thezaurus-front
    ports:
      - "3000:3000"
    volumes:
      - ./api/openapi.json:/api/openapi.json:ro
    environment:
      - API_URL=http://api:8080
      - VITE_MOCK_AUTH=false
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-your-google-client-id.apps.googleusercontent.com}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
    depends_on:
      api:
        condition: service_healthy
    x-google-cloudrun: null
    develop:
      watch:
        - action: sync
          path: ./front
          target: /app
          ignore:
            - node_modules/
            - .next/
        - action: rebuild
          path: ./front/package.json
        - action: rebuild
          path: ./front/package-lock.json
