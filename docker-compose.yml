services:
  # Firestore Emulator pour le développement local
  firestore:
    image: google/cloud-sdk:emulators
    container_name: thezaurus-firestore-emulator
    command: gcloud beta emulators firestore start --host-port=0.0.0.0:9000
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000"]
      interval: 5s
      timeout: 5s
      retries: 10

  # API Backend (Quarkus)
  api:
    build:
      context: ./api
      dockerfile: src/main/docker/Dockerfile.jvm
    container_name: thezaurus-api
    ports:
      - "8080:8080"
    environment:
      - QUARKUS_GOOGLE_CLOUD_PROJECT_ID=thezaurus-dev
      - QUARKUS_GOOGLE_CLOUD_FIRESTORE_DATABASE_ID=thezaurus-dev
      - FIRESTORE_EMULATOR_HOST=firestore:9000
      - QUARKUS_HTTP_PORT=8080
      - QUARKUS_PROFILE=dev
      - GOOGLE_APPLICATION_CREDENTIALS=/tmp/credentials.json
    depends_on:
      firestore:
        condition: service_healthy
    volumes:
      - ${HOME}/.config/gcloud/application_default_credentials.json:/tmp/credentials.json:ro

  # UI Frontend (Next.js)
  front:
    build:
      context: ./front
      args:
        - API_URL=http://api:8080
    container_name: thezaurus-front
    ports:
      - "3000:3000"
    environment:
      - API_URL=http://api:8080
    depends_on:
      - api
