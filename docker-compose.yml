services:
  # API Backend (Quarkus)
  api:
    build:
      context: ./api
      dockerfile: src/main/docker/Dockerfile.jvm
    container_name: thezaurus-api
    ports:
      - "8080:8080"
    environment:
      - QUARKUS_GOOGLE_CLOUD_PROJECT_ID=thezaurus-494709
      - QUARKUS_GOOGLE_CLOUD_FIRESTORE_DATABASE_ID=thezaurus-dev
      - QUARKUS_HTTP_PORT=8080
      - GOOGLE_APPLICATION_CREDENTIALS=/tmp/credentials.json
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-dummy-client-id}
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}
      - SLACK_SIGNING_SECRET=${SLACK_SIGNING_SECRET}
    volumes:
      # Credentials (service-account) lues depuis le repo => connexion au vrai Firestore (GCP)
      - ./api/.config/gcloud/application_default_credentials.json:/tmp/credentials.json:ro

  # UI Frontend (Next.js)
  front:
    build:
      context: ./front
      target: dev
    container_name: thezaurus-front
    ports:
      - "3000:3000"
    environment:
      - API_URL=http://api:8080
      - VITE_MOCK_AUTH=false
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-your-google-client-id.apps.googleusercontent.com}
    depends_on:
      - api
    develop:
      watch:
        - action: sync
          path: ./front
          target: /app
          ignore:
            - node_modules/
            - .next/
        - action: rebuild
          path: ./front/package.json
        - action: rebuild
          path: ./front/package-lock.json
