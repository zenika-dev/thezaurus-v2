services:
  # Firestore Emulator pour le développement local
  firestore:
    image: google/cloud-sdk:emulators
    container_name: thezaurus-firestore-emulator
    command: gcloud beta emulators firestore start --host-port=0.0.0.0:8080
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 5s
      timeout: 5s
      retries: 10

  # API Backend (Quarkus)
  api:
    build:
      context: ./api
      dockerfile: src/main/docker/Dockerfile.jvm
    container_name: thezaurus-api
    ports:
      - "8081:8081"
    environment:
      - QUARKUS_GOOGLE_CLOUD_PROJECT_ID=thezaurus-dev
      - QUARKUS_GOOGLE_CLOUD_FIRESTORE_DATABASE_ID=thezaurus-dev
      - QUARKUS_GOOGLE_CLOUD_FIRESTORE_EMULATOR_HOST=firestore:8080
      - QUARKUS_HTTP_PORT=8081
    depends_on:
      firestore:
        condition: service_healthy

  # UI Frontend (React Router / Vite)
  ui:
    build:
      context: ./ui
    container_name: thezaurus-ui
    ports:
      - "3000:3000"
    environment:
      - API_URL=http://api:8081
    depends_on:
      - api
